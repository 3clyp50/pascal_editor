    <polygon points="320,106 449,340 191,340" fill="#ffffff" stroke="#d53b35" stroke-width="13" stroke-linejoin="round"/>
    <path d="M194 106 Q320 76 446 106" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="5"/>
