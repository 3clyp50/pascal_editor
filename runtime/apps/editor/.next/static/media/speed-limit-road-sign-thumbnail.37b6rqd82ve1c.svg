<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Speed limit road sign</title>
  <desc id="desc">A circular white speed limit 50 sign with a red border on a roadside post.</desc>
  <defs>
    <linearGradient id="speedBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#d4dce3"/></linearGradient>
    <linearGradient id="speedMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20262c"/><stop offset=".48" stop-color="#69757e"/><stop offset="1" stop-color="#2d353c"/></linearGradient>
    <filter id="speedShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="640" rx="44" fill="url(#speedBg)"/>
  <path d="M0 522 Q160 480 320 508 T640 494 V640 H0Z" fill="#c7cfd5" opacity=".62"/>
