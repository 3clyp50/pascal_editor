    <path d="M298 548h9V357h-9zM333 548h9V357h-9z" fill="#171c21" opacity=".7"/>
    <circle cx="320" cy="221" r="151" fill="#f7f4e9" stroke="#252a2f" stroke-width="10"/>
    <circle cx="320" cy="221" r="137" fill="#f7f4e9" stroke="#c93432" stroke-width="15"/>
    <text x="320" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" fill="#252a2f">50</text>
    <path d="M211 122 Q320 75 429 122" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="6"/>
  </g>
</svg>
